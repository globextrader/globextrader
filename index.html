<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стратегия на ES — результаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b26;--panel:#14232f;--line:#26394a;--ink:#ece6d8;--mute:#8da0b0;--gain:#6fc3a0;--loss:#d9806b;--brass:#c9a96a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 420px at 90% -5%,rgba(201,169,106,.10),transparent 60%),var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:0 clamp(16px,5vw,64px) 48px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font:500 13px "IBM Plex Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:28px;height:1px;background:var(--brass);vertical-align:middle;margin-right:14px}
.meta{color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.hero{padding:64px 0 44px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:end}
.eyebrow{color:var(--brass);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:18px}
.name{font:400 clamp(40px,6.2vw,84px)/1 Newsreader,Georgia,serif;margin:0;letter-spacing:-.02em}
.tagline{color:var(--mute);margin:14px 0 0;font-size:15px;letter-spacing:.04em}
.lede{margin:24px 0 0}
.lede-main{font:400 clamp(28px,3.4vw,40px)/1.1 Newsreader,Georgia,serif;letter-spacing:-.01em}
.lede-tags{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:10px 32px}
.lede-tags li{display:flex;align-items:baseline;gap:12px;font:400 19px Newsreader,Georgia,serif}
.lede-tags li::before{content:"";width:6px;height:6px;background:var(--brass);transform:rotate(45deg);flex:none;position:relative;top:-3px}
.lede-tags b{font-weight:400;color:var(--ink)}
.lede-tags span{color:var(--mute)}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:26px;border-top:1px solid var(--line);max-width:560px}
.duo div{padding:14px 22px 0 0}
.duo div+div{padding:14px 0 0 22px;border-left:1px solid var(--line)}
.duo b{display:block;font:500 11px "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
.duo span{color:var(--mute);font-size:14px;line-height:1.55}
.pills{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.pills li{border:1px solid var(--line);padding:6px 12px;font-size:12.5px;color:var(--mute)}
.pills b{color:var(--ink);font-weight:500;margin-right:8px;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.result{border-left:1px solid var(--line);padding-left:40px}
.rl{color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
#total{font:400 clamp(52px,8vw,104px)/1 Newsreader,Georgia,serif;letter-spacing:-.02em;margin:10px 0 12px}
#total small{font-size:.32em;margin-left:.3em}
.cap{color:var(--mute);font-size:13px;max-width:38ch}
.intro{position:relative}
.pills .ddli{padding:0;transition:border-color .2s}
.pills .ddli:hover,.pills .ddli:has(.instbox[open]){border-color:var(--brass)}
.instbox summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px}
.instbox summary::-webkit-details-marker{display:none}
.instbox summary b{margin-right:0}
.instbox summary .cur{color:var(--ink)}
.instbox summary:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.chev{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .2s}
.instbox[open] .chev{transform:rotate(-135deg);margin-top:3px}
.groups{position:absolute;left:0;top:calc(100% + 10px);z-index:20;width:min(700px,calc(100vw - 28px));display:grid;grid-template-columns:1fr;gap:22px;margin:0;padding:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.grp h3{font:500 12px "IBM Plex Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:0 0 4px}
.gnote{color:var(--mute);font-size:13px;margin:0 0 14px}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.inst{background:var(--panel);padding:16px 16px 12px;color:inherit;text-decoration:none;display:block}
a.inst:hover{background:#18303f}
.inst.live{box-shadow:inset 2px 0 0 var(--brass)}
.ih{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font:400 30px Newsreader,Georgia,serif}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:2px 8px;white-space:nowrap}
.live .chip{color:var(--brass);border-color:var(--brass)}
.iname{color:var(--mute);font-size:13px;margin:2px 0 12px}
.inst dl{margin:0}
.inst dl div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0;font-size:12.5px}
.inst dt{color:var(--mute)}
.inst dd{margin:0;text-align:right}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.chartwrap{background:var(--panel);border:1px solid var(--line);padding:20px 20px 12px;position:relative}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{background:none;border:1px solid transparent;color:var(--mute);font:inherit;font-size:14px;padding:5px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--brass)}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip small{color:var(--mute);margin-left:6px}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:6px 10px;font-size:13px;display:none;white-space:nowrap}
h2{font:400 20px Newsreader,Georgia,serif;margin:40px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0}
.grid div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid dt{color:var(--mute);font-size:13px}
.grid dd{margin:2px 0 0;font:400 26px Newsreader,Georgia,serif}
.grid small,td small{font:400 13px "IBM Plex Sans",sans-serif;color:var(--mute);margin-left:6px}
.tablewrap{max-height:320px;overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 16px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{white-space:nowrap;position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:400;font-size:13px}
.status{color:var(--mute);font-size:13px;margin-top:12px}
th:first-child{left:0;z-index:2}
td:first-child{position:sticky;left:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:32px;padding:40px 0 32px}
  .result{border-left:0;border-top:1px solid var(--line);padding:24px 0 0}
  .groups{grid-template-columns:1fr}
}
@media (max-width:640px){
  .duo{grid-template-columns:1fr}
  .duo div+div{padding:14px 0 0;border-left:0;border-top:1px solid var(--line);margin-top:14px}
  .duo div{padding-right:0}
  body{padding:0 14px 36px}
  header{padding:18px 0}
  .brand span{display:block;margin:2px 0 0}
  .hero{padding:28px 0 18px;gap:10px}
  .chartwrap{padding:12px 8px 8px}
  .tabs{flex-wrap:wrap}
  .tabs button{padding:5px 10px;font-size:13px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid div{padding:12px 12px}
  .grid dd{font-size:22px}
  h2{margin-top:28px}
  th,td{padding:7px 10px;font-size:13px}
}
footer{margin-top:40px;color:var(--mute);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
</style>
</head>
<body>
<header>
  <div class="brand">Globextrader</div>
  <div class="meta">Intraday Scalping Strategy</div>
</header>

<section class="hero">
  <div class="intro">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="name" id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="lede"><div class="lede-main" id="ledeMain"></div><ul class="lede-tags" id="ledeTags"></ul></div>
    <div class="duo" id="duo"></div>
    <ul class="pills" id="pills">
      <li class="ddli"><details class="instbox" id="instbox">
        <summary><b>Инструмент</b><span class="cur" id="curInst"></span><span class="chev"></span></summary>
        <div class="groups" id="insts"></div>
      </details></li>
    </ul>
  </div>
  <div class="result">
    <div class="rl">Результат · ES</div>
    <div class="num" id="total">—</div>
    <div class="cap" id="cap"></div>
  </div>
</section>



<section class="chartwrap" aria-label="График результатов">
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="mtabs"></div>
  <svg id="chart" viewBox="0 0 1000 380" role="img" aria-label="График P&L"></svg>
  <svg id="dd" viewBox="0 0 1000 90" role="img" aria-label="Просадка"></svg>
  <div class="tip num" id="tip"></div>
</section>
<div class="status" id="status"></div>
<pre class="status" id="debug" style="white-space:pre-wrap;display:none"></pre>

<h2 class="dh">Статистика</h2>
<dl class="grid" id="stats"></dl>

<h2 class="dh">Результаты по периодам</h2>
<div class="tabs" id="tblTabs"></div>
<div class="tablewrap"><table class="num"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<footer id="disc"></footer>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {
  title: "Стратегия на ES",
  subtitle: "E-mini S&P 500 Futures",
  // Ссылка на CSV: Файл → Поделиться → Опубликовать в Интернете → лист → формат CSV
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT933YGGprjxlAVyraxpCgAt62U9KIj8WO5yZEwBW12H0BOaoG-XRnX7dLzR4cN-DgrTcRfZm3OvuJS/pub?gid=81088550&single=true&output=csv",
  // Столбцы ищутся по названию в первой строке; если не найдены — берутся по номеру (0 = первый)
  dateHeader: ["DATE"], pnlHeader: ["PNL,$"],   // можно несколько вариантов названия; берётся первый найденный (пробелы не важны)
  dateColumn: 0, pnlColumn: 1,
  // Необязательные столбцы (названия в первой строке). Если столбца нет — соответствующие данные не показываются.
  ticksHeader: ["TOTAL TICKS", "TICKS"], winsHeader: ["WIN"], lossesHeader: ["LOSS"], tradesHeader: ["TOTAL TRADES", "TRADES"],
  capital: 0,             // размер счёта в $. Если указать, рядом с $ покажется доходность в %
  periodsPerYear: 252,
  updateNY: { h: 16, m: 30 },   // обновление раз в сутки в это время по Нью-Йорку
  // Шапка сайта. Тексты, инструменты, стоп/тейк по каждому инструменту — всё меняется здесь.
  strategy: {
    eyebrow: "Торговая стратегия",
    name: "Scalping Globextrader",
    tagline: "Гибридный подход: системные правила и дискреционное исполнение",
    ledeMain: "Внутридневной скальпинг",
    ledeTags: [["Фьючерсы", "на индексы США"], ["Опционы 0DTE", "на индексные ETF"]],
    approach: [
      ["Системная составляющая", "Торговый план, лимиты риска и параметры сделки определены заранее."],
      ["Дискреционная составляющая", "Решение о входе в сделку принимает трейдер с учётом текущей рыночной ситуации."]
    ],
    pills: [["Торговое окно", "09:30–11:00 (Нью-Йорк, ET)"], ["Объём", "1 контракт, без реинвестирования"], ["Комиссия", "$4 за сделку, учтена"]],
    // href: ссылка на страницу со статистикой инструмента (когда появится); live: true — результаты уже на этой странице
    groups: [
      { title: "Фьючерсы", tickLabel: "Тик", note: "CME · торговля 09:30–11:00 ET", items: [
        { sym: "ES", name: "E-mini S&P 500", tick: "0,25 пт = $12,50", stop: "20 тиков · $250", take: "10 тиков · $125", live: true, href: "" },
        { sym: "NQ", name: "E-mini Nasdaq-100", tick: "0,25 пт = $5,00", stop: "", take: "", href: "" },
        { sym: "YM", name: "E-mini Dow Jones", tick: "1 пт = $5,00", stop: "", take: "", href: "" }
      ] },
      { title: "Опционы 0DTE", tickLabel: "Контракт", note: "Экспирация в день торговли (0DTE) · 09:30–11:00 ET", items: [
        { sym: "SPX", name: "Индекс S&P 500", tick: "×$100", stop: "", take: "", href: "" },
        { sym: "SPY", name: "ETF S&P 500", tick: "×100 акций", stop: "", take: "", href: "" },
        { sym: "QQQ", name: "ETF Nasdaq-100", tick: "×100 акций", stop: "", take: "", href: "" },
        { sym: "DIA", name: "ETF Dow Jones", tick: "×100 акций", stop: "", take: "", href: "" }
      ] }
    ]
  },
  disclaimer: "Результаты получены в ходе ретроспективного тестирования (бэктеста) на исторических данных и не являются результатами реальной торговли. Такие результаты имеют ограничения: они определены постфактум и могут не отражать влияние проскальзывания, ликвидности, задержек исполнения и иных рыночных условий. Прошлые результаты не гарантируют будущей доходности. Торговля фьючерсами и опционами сопряжена с высоким риском, включая риск потери всех вложенных средств. Материалы носят исключительно информационный характер и не являются индивидуальной инвестиционной рекомендацией, офертой или предложением приобрести какие-либо финансовые инструменты или услуги."
};
/* ===================== */

const $ = id => document.getElementById(id);
const MON = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const UNITS = {
  day:   { tab: "Дни",    avg: "Средний день",    pos: "Прибыльных дней",    best: "Лучший день",    worst: "Худший день",    col: "День" },
  week:  { tab: "Недели", avg: "Средняя неделя",  pos: "Прибыльных недель",  best: "Лучшая неделя",  worst: "Худшая неделя",  col: "Неделя с" },
  month: { tab: "Месяцы", avg: "Средний месяц",   pos: "Прибыльных месяцев", best: "Лучший месяц",   worst: "Худший месяц",   col: "Месяц" }
};
let days = [], view = "day";
const cap = CONFIG.capital > 0;
const sign = v => (v >= 0 ? "+" : "−");
const money = v => sign(v) + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
const pctS = v => sign(v) + Math.abs(v / CONFIG.capital * 100).toFixed(2) + "%";
const val = v => money(v) + (cap ? `<small>${pctS(v)}</small>` : "");
const cls = v => (v >= 0 ? "pos" : "neg");
const d2 = n => String(n).padStart(2, "0");
const fmtDate = t => { const d = new Date(t); return `${d2(d.getUTCDate())}.${d2(d.getUTCMonth() + 1)}.${String(d.getUTCFullYear()).slice(2)}`; };

/* ---------- время обновления (16:30 Нью-Йорк) ---------- */
function nyOffset(ts) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23",
    year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" })
    .formatToParts(ts).map(x => [x.type, x.value]));
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - (ts - ts % 1000);
}
function cutoffs(now = Date.now()) {
  const w = new Date(now + nyOffset(now));
  const at = dd => { const g = Date.UTC(w.getUTCFullYear(), w.getUTCMonth(), w.getUTCDate() + dd, CONFIG.updateNY.h, CONFIG.updateNY.m); return g - nyOffset(g); };
  const today = at(0);
  return today <= now ? { last: today, next: at(1) } : { last: at(-1), next: today };
}

/* ---------- данные ---------- */
let fetchErr = "";
let slashOrder = "dmy";
function parseDate(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d{1,2})([.\/])(\d{1,2})[.\/](\d{4})/))) {
    const mdy = m[2] === "/" && slashOrder === "mdy";
    return Date.UTC(+m[4], (mdy ? +m[1] : +m[3]) - 1, mdy ? +m[3] : +m[1]);
  }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return Date.UTC(+m[1], m[2] - 1, +m[3]);
  return NaN;
}
function splitCsv(line) {
  const out = []; let cur = "", q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out;
}
let dbg = null;
const has = { ticks: false, win: false, loss: false, trades: false };
function toNum(x) {   // 230 · -24 · 1 234,5 · 1,234.56 · 1.234,56 · (24) · $230
  let t = String(x ?? "").replace(/[$\s\u00a0]/g, "").replace(/\u2212/g, "-");
  const neg = /^\(.*\)$/.test(t); t = t.replace(/[()]/g, "");
  const lc = t.lastIndexOf(","), ld = t.lastIndexOf(".");
  if (lc > -1 && ld > -1) t = lc > ld ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (lc > -1) t = /^-?\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g, "") : t.replace(",", ".");
  const v = parseFloat(t); return neg ? -v : v;
}
const norm = c => String(c ?? "").replace(/\s+/g, "").toUpperCase();   // "PNL, $" и "PNL,$" считаются одинаковыми
let shifted = [];
function realign(r, n) {   // в строке не хватает ячейки (всё правее заметки сдвинуто влево): возвращаем столбцы на место
  if (r.length >= n) return r;
  const t = r.findIndex((c, i) => i >= 2 && c.trim() && isNaN(toNum(c)) && !/[%#]/.test(c));
  if (t < 0) return r;
  return r.slice(0, t + 1).concat(Array(n - r.length).fill(""), r.slice(t + 1));
}
function parseCsv(text) {
  const rows = text.split(/\r?\n/).filter(r => r.trim()).map(splitCsv);
  const dh = [].concat(CONFIG.dateHeader).map(norm);
  const hr = Math.max(0, rows.findIndex(r => r.some(c => dh.includes(norm(c)))));   // строка заголовков может быть не первой
  const head = rows[hr].map(norm);
  const find = (h, def) => { for (const x of [].concat(h)) { const i = head.indexOf(norm(x)); if (i >= 0) return i; } return def; };
  const di = find(CONFIG.dateHeader, -1), pi = find(CONFIG.pnlHeader, -1);
  const ci = { ticks: find(CONFIG.ticksHeader, -1), win: find(CONFIG.winsHeader, -1), loss: find(CONFIG.lossesHeader, -1), trades: find(CONFIG.tradesHeader, -1) };
  const missing = [di < 0 && "DATE", pi < 0 && "PNL,$"].filter(Boolean);
  if (missing.length) {   // лучше ошибка, чем чужой столбец
    dbg = { headerRow: hr + 1, heads: head.filter(Boolean).join(" | "), date: "-", pnl: "-", found: "-", sample: rows.slice(0, 4).map(r => r.slice(0, 8).join(";")).join("\n"), days: 0, first: "-", last: "-", total: 0, problem: "не найден столбец " + missing.join(", ") };
    return [];
  }
  slashOrder = "dmy";   // 3/14/2026 → месяц первым; 14/03/2026 → день первым
  for (const r of rows.slice(hr + 1)) { const m = (r[di] ?? "").trim().match(/^(\d{1,2})\/(\d{1,2})\/\d{4}/); if (m) { if (+m[1] > 12) { slashOrder = "dmy"; break; } if (+m[2] > 12) { slashOrder = "mdy"; break; } } }

}
function demoData() {
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const out = []; let t = Date.UTC(2026, 1, 9);
  while (out.length < 195) {

}

const FIELDS = ["pnl", "ticks", "win", "loss", "trades"];
function periods(kind) {
  if (kind === "day") return days.map(d => ({ ...d, label: fmtDate(d.t) }));
  const map = new Map();
  for (const d of days) {
    const dt = new Date(d.t);
    const key = kind === "week" ? d.t - ((dt.getUTCDay() + 6) % 7) * 864e5 : Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), 1);
    if (!map.has(key)) map.set(key, { key, pnl: 0, ticks: 0, win: 0, loss: 0, trades: 0 });
    const p = map.get(key); for (const f of FIELDS) p[f] += d[f] || 0;

  return [...map.values()].map(p => ({
    ...p,
    label: kind === "week" ? fmtDate(p.key) : MON[new Date(p.key).getUTCMonth()] + " " + String(new Date(p.key).getUTCFullYear()).slice(2)

}

/* ---------- графики ---------- */
function niceTicks(min, max) {

  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];

}
const axisNum = v => (v < 0 ? "−" : "") + (Math.abs(v) >= 1000 ? +(Math.abs(v) / 1000).toFixed(1) + "k" : Math.abs(v));
let W = 1000, H = 380;
const pad = { l: 60, r: 12, t: 26, b: 36 };
function setSize() {   // размер графика подгоняется под ширину экрана, чтобы подписи не уменьшались на телефоне
  const w = Math.round($("chart").getBoundingClientRect().width) || 1000;
  W = Math.max(w, 280); H = W < 600 ? 300 : 380; pad.l = W < 600 ? 46 : 60;
  $("chart").setAttribute("viewBox", `0 0 ${W} ${H}`); $("dd").setAttribute("viewBox", `0 0 ${W} 90`);
}

function frame(minV, maxV, fmt) {
  const ticks = niceTicks(Math.min(0, minV), Math.max(0, maxV));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  let g = "";
  for (const v of ticks) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#26394a"/>` +
    `<text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end" fill="#8da0b0" font-size="12">${fmt ? fmt(v) : v.toLocaleString("en-US")}</text>`;
  g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="#c9a96a" stroke-dasharray="3 4"/>`;
  return { g, y };
}
function xLabels(P, xc, maxLabels) {
  const k = Math.ceil(P.length / Math.max(2, Math.min(maxLabels, Math.floor((W - pad.l) / 72)))); let g = "";
  P.forEach((p, i) => { if (i % k === 0) g += `<text x="${xc(i)}" y="${H - 12}" text-anchor="middle" fill="#8da0b0" font-size="12">${p.label}</text>`; });
  return g;
}
const overlay = () => `<line id="cx" y1="${pad.t}" y2="${H - pad.b}" stroke="#8da0b0" opacity="0"/><rect id="hit" x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent" style="touch-action:pan-y"/>`;

function lineChart(P, vals, o) {
  const { g, y } = frame(...(o.range || [Math.min(...vals), Math.max(...vals)]), o.yFmt);
  const x = i => pad.l + (i / Math.max(P.length - 1, 1)) * (W - pad.l - pad.r);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const col = o.color || (vals[vals.length - 1] >= 0 ? "#6fc3a0" : "#d9806b");
  $("chart").innerHTML = g + xLabels(P, x, 8) +
    `<path d="M${x(0)},${y(0)} L${pts.join(" L")} L${x(P.length - 1)},${y(0)}Z" fill="${col}" opacity=".12"/>` +
    `<polyline class="line" id="ln" points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>` +
    (o.unit ? `<text x="${W - pad.r}" y="12" text-anchor="end" fill="#c9a96a" font-size="13">${o.unit}</text>` : "") + overlay();
  const ln = $("ln"); ln.style.setProperty("--len", ln.getTotalLength());
  if (o.dd) {
    let peak = 0; const dd = vals.map(v => (peak = Math.max(peak, v), v - peak));
    const dmin = Math.min(-1, ...dd), DH = 90, dy = v => 6 + (v / dmin) * (DH - 14);
    $("dd").style.display = "block";
    $("dd").innerHTML = `<text x="${pad.l - 8}" y="14" text-anchor="end" fill="#8da0b0" font-size="12">0</text>` +
      `<text x="${pad.l - 8}" y="${DH - 6}" text-anchor="end" fill="#8da0b0" font-size="12">${axisNum(Math.round(dmin))}</text>` +
      `<path d="M${x(0)},${dy(0)} L${dd.map((v, i) => `${x(i).toFixed(1)},${dy(v).toFixed(1)}`).join(" L")} L${x(P.length - 1)},${dy(0)}Z" fill="#d9806b" opacity=".35"/>` +
      `<text x="${W - pad.r}" y="14" text-anchor="end" fill="#8da0b0" font-size="13">Drawdown, $</text>`;
  } else $("dd").style.display = "none";

}

// o.stack(p) -> [[value, color], ...]: положительные значения растут вверх, отрицательные вниз от нуля
// o.label(p) -> текст (или массив текстов по сегментам); o.range -> фиксированная ось; o.tip(i) -> html
function barChart(P, o) {
  const segs = P.map(o.stack);
  const tops = segs.map(a => a.reduce((s, c) => s + Math.max(c[0], 0), 0)), bots = segs.map(a => a.reduce((s, c) => s + Math.min(c[0], 0), 0));
  const { g, y } = frame(o.range ? o.range[0] : Math.min(...bots), o.range ? o.range[1] : Math.max(...tops, 1) * 1.08, o.yFmt);
  const slot = (W - pad.l - pad.r) / P.length, bw = Math.max(slot * 0.68, 1.5);
  const x = i => pad.l + slot * (i + 0.5);
  const fs = slot < 30 ? 10 : 12;
  const maxLen = Math.max(...P.flatMap(p => [].concat(o.label(p)).map(t => String(t).length)));
  const wPlain = maxLen * fs * 0.58;
  const mode = o.prefix && slot >= wPlain + fs * 0.6 + 2 ? 2 : slot >= wPlain * 0.9 ? 1 : 0;   // 2: с "$", 1: только число, 0: без подписей
  const lab = t => mode === 2 ? (String(t).startsWith("-") ? "−" + o.prefix + String(t).slice(1) : o.prefix + t) : t;
  let bars = "";
  P.forEach((p, i) => {
    let up = 0, dn = 0;
    const labels = [].concat(o.label(p));
    segs[i].forEach(([v, c], j) => {
      const from = v >= 0 ? up : dn, to = from + v;
      if (v >= 0) up = to; else dn = to;
      const y0 = y(from), y1 = y(to);
      if (v) bars += `<rect x="${x(i) - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(Math.abs(y1 - y0), 1)}" fill="${c}"/>`;
      if (mode) bars += `<text x="${x(i)}" y="${v >= 0 ? y1 - 5 : y1 + 13}" text-anchor="middle" fill="#ece6d8" font-size="${fs}">${lab(labels[j])}</text>`;
    });
    if (!tops[i] && !bots[i]) bars += `<rect x="${x(i) - bw / 2}" y="${y(0) - 1}" width="${bw}" height="2" fill="#8da0b0"/>`;   // день без сделок: нулевой столбец
  });
  const legend = o.legend ? `<text x="${W - pad.r}" y="12" text-anchor="end" fill="#c9a96a" font-size="13">${o.legend}</text>` : "";
  $("chart").innerHTML = g + bars + legend + xLabels(P, x, P.length <= 12 ? 12 : 14) + overlay();
  $("dd").style.display = "none";

function hover(n, x, text) {
  const hit = $("hit"), tip = $("tip"), cx = $("cx");
  const move = e => {
    const box = $("chart").getBoundingClientRect(), px = ((e.clientX - box.left) / box.width) * W;
    let i = 0, best = 1e9;
    for (let k = 0; k < n; k++) { const dist = Math.abs(x(k) - px); if (dist < best) { best = dist; i = k; } }
    cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i)); cx.setAttribute("opacity", 1);
    tip.style.display = "block"; tip.innerHTML = text(i);
    const wr = $("chart").parentElement.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(e.clientX - wr.left + 14, wr.width - tip.offsetWidth - 8)) + "px";
    const cb = $("chart").getBoundingClientRect(), top0 = cb.top - wr.top + 4;   // подсказка не заходит на кнопки над графиком
    tip.style.top = Math.max(top0, e.pointerType === "touch" ? top0 : e.clientY - wr.top - 40) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", e => { if (e.pointerType === "touch") return; tip.style.display = "none"; cx.setAttribute("opacity", 0); });
}

/* ---------- статистика и таблица ---------- */
const tickS = v => sign(v) + Math.abs(+v.toFixed(1)).toLocaleString("en-US");
function tradeItems() {
  const sum = k => days.reduce((a, d) => a + (d[k] || 0), 0), out = [], tr = sum("trades");
  if (has.trades) out.push(["Всего сделок", tr.toLocaleString("en-US"), ""]);
  if (has.win) out.push(["Прибыльных сделок", sum("win").toLocaleString("en-US") + (tr ? `<small>${(sum("win") / tr * 100).toFixed(1)}%</small>` : ""), ""]);
  if (has.loss) out.push(["Убыточных сделок", sum("loss").toLocaleString("en-US") + (tr ? `<small>${(sum("loss") / tr * 100).toFixed(1)}%</small>` : ""), ""]);
  if (has.ticks) out.push(["Результат в тиках", tickS(sum("ticks")), cls(sum("ticks"))]);
  return out;
}
function stats(P) {
  const td = has.trades ? days.filter(d => d.trades > 0) : days;   // праздники и дни без сделок в статистику не входят
  const u = UNITS[view], v = (view === "day" && has.trades ? P.filter(p => p.trades > 0) : P).map(p => p.pnl), dv = td.map(d => d.pnl), n = dv.length;
  const total = dv.reduce((a, b) => a + b, 0);
  let c = 0, peak = 0, mdd = 0;
  for (const x of dv) { c += x; peak = Math.max(peak, c); mdd = Math.min(mdd, c - peak); }
  const mean = total / n, sd = Math.sqrt(dv.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(n - 1, 1));
  const down = Math.sqrt(dv.reduce((a, b) => a + Math.min(0, b) ** 2, 0) / n);
  const gain = dv.filter(x => x > 0).reduce((a, b) => a + b, 0), loss = -dv.filter(x => x < 0).reduce((a, b) => a + b, 0);
  const k = Math.sqrt(CONFIG.periodsPerYear);
  const extra = tradeItems();
  const items = [
    ["Общий результат", val(total), cls(total)],
    ["Макс. просадка", val(mdd), "neg"],
    [u.avg, val(v.reduce((a, b) => a + b, 0) / v.length), cls(v.reduce((a, b) => a + b, 0))],
    [u.pos, (v.filter(x => x > 0).length / v.length * 100).toFixed(1) + "%", ""],
    [u.best, val(Math.max(...v)), "pos"],
    [u.worst, val(Math.min(...v)), cls(Math.min(...v))],
    ["Profit factor", loss ? (gain / loss).toFixed(2) : "—", ""],
    ["Коэффициент Шарпа", sd ? (mean / sd * k).toFixed(2) : "—", ""],
    ["Коэффициент Сортино", down ? (mean / down * k).toFixed(2) : "—", ""],

  $("stats").innerHTML = items.map(([a, b, c2]) => `<div><dt>${a}</dt><dd class="num ${c2}">${b}</dd></div>`).join("");
  $("total").innerHTML = `<span class="${cls(total)}">${money(total)}</span>` + (cap ? `<small class="${cls(total)}">${pctS(total)}</small>` : "");
  $("cap").textContent = `Накопленный результат по ES за период с ${fmtDate(days[0].t)} по ${fmtDate(days[days.length - 1].t)}. Стоимость тика $12,50; комиссии учтены.`;
}

}
$("tblTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tblView = b.dataset.v; tables(); } });
let metric = "cum";

const avail = k => k === "ticks" ? has.ticks : k === "trades" ? has.trades : k === "wl" ? has.win && has.loss : k === "wr" ? has.win && has.trades : true;

  if (metric === "wl") barChart(P, { stack: p => [[p.win, GAIN], [-p.loss, LOSS]], label: p => [p.win, p.loss], yFmt: v => Math.abs(v), legend: "Win ↑ · Loss ↓", tip: i => `${P[i].label}: <b class="pos">${P[i].win}</b> win · <b class="neg">${P[i].loss}</b> loss<small>всего ${P[i].trades}</small>` });

/* ---------- загрузка: раз в сутки после 16:30 ET ---------- */
async function load() {
  const { last, next } = cutoffs();
  let csv = null, at = Date.now(), note = "";
  if (CONFIG.sheetCsvUrl) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem("es_cache")); } catch (e) {}
    if (cache && cache.cutoff === last && !location.search.includes("fresh")) { csv = cache.csv; at = cache.at; }
    else {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl + (CONFIG.sheetCsvUrl.includes("?") ? "&" : "?") + "_=" + Date.now());   // без опции cache: она вызывает CORS-preflight, который Google не пропускает
        if (!res.ok) throw new Error(res.status);
        csv = await res.text();
        if (parseCsv(csv).length >= 2) try { localStorage.setItem("es_cache", JSON.stringify({ cutoff: last, csv, at })); } catch (e) {}
      } catch (e) {
        fetchErr = String(e);
        if (cache) { csv = cache.csv; at = cache.at; } else note = "Не удалось загрузить таблицу. Проверьте, что лист опубликован в формате CSV.";
      }
    }
  } else note = "Демо-данные. Вставьте ссылку на CSV в CONFIG.sheetCsvUrl.";
  days = csv ? parseCsv(csv) : [];
  const showDebug = () => {
    if (location.search.includes("debug") && !dbg && fetchErr) { $("debug").style.display = "block"; $("debug").textContent = "Диагностика\nОшибка загрузки: " + fetchErr; }
    if (location.search.includes("debug") && dbg) {
      $("debug").style.display = "block";
      $("debug").textContent = `Диагностика${dbg.problem ? " — ОШИБКА: " + dbg.problem : ""}\nСтрока заголовков: ${dbg.headerRow}\nСтолбцы в таблице: ${dbg.heads}\nДата: ${dbg.date}; деньги: ${dbg.pnl}; остальные: ${dbg.found}\nПорядок дат с косой чертой: ${slashOrder}\nСтрок со сдвинутыми ячейками (исправлены автоматически): ${shifted.length ? shifted.join(", ") : "нет"}\nДней прочитано: ${dbg.days}; с ${dbg.first} по ${dbg.last}; сумма P&L: ${dbg.total}\nПервые строки:\n${dbg.sample}`;
    }
  };
  if (days.length < 2) {
    if (CONFIG.sheetCsvUrl) {   // реальный сайт: демо-цифры не показываем никогда
      $("status").textContent = note || ("Не удалось прочитать данные из таблицы" + (dbg && dbg.problem ? ": " + dbg.problem : "") + ". Откройте страницу с ?debug для диагностики.");
      document.querySelectorAll(".result, .chartwrap, .dh, #stats, #tblTabs, .tablewrap").forEach(e => e.style.display = "none");
      showDebug(); setTimeout(load, 10 * 60000); return;
    }
    days = demoData(); note = note || "Демо-данные.";
  }
  document.querySelectorAll(".result, .chartwrap, .dh, #stats, #tblTabs, .tablewrap").forEach(e => e.style.display = "");
  $("status").textContent = note || "(данные обновляются раз в сутки)";
  showDebug();
  render(); tables();
  setTimeout(load, Math.min(next - Date.now() + 5000, 2 ** 31 - 1));
}

function renderIntro() {
  const S = CONFIG.strategy;
  document.title = S.name + " — результаты";
  $("eyebrow").textContent = S.eyebrow; $("name").textContent = S.name; $("tagline").textContent = S.tagline; $("ledeMain").textContent = S.ledeMain;
  $("ledeTags").innerHTML = S.ledeTags.map(t => `<li><span class="t"><b>${t[0]}</b> ${t[1]}</span></li>`).join("");
  $("duo").innerHTML = S.approach.map(a => `<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join("");
  $("pills").insertAdjacentHTML("afterbegin", S.pills.map(p => `<li><b>${p[0]}</b>${p[1]}</li>`).join(""));
  $("curInst").textContent = (S.groups.flatMap(g => g.items).find(i => i.live) || {}).sym || "";
  const row = (k, v) => `<div><dt>${k}</dt><dd>${v || "—"}</dd></div>`;
  const card = (i, lbl) => {
    const tag = i.href ? "a" : "div", chip = i.live ? "Результаты ниже" : i.href ? "Статистика →" : "Скоро";
    return `<${tag} class="inst${i.live ? " live" : ""}"${i.href ? ` href="${i.href}"` : ""}><div class="ih"><span class="sym">${i.sym}</span><span class="chip">${chip}</span></div><div class="iname">${i.name}</div><dl>${row(lbl, i.tick)}${row("Стоп-лосс", i.stop)}${row("Тейк-профит", i.take)}</dl></${tag}>`;
  };
  $("insts").innerHTML = S.groups.map(g => `<div class="grp"><h3>${g.title}</h3><p class="gnote">${g.note}</p><div class="icards">${g.items.map(i => card(i, g.tickLabel || "Тик")).join("")}</div></div>`).join("");
}
renderIntro();
document.addEventListener("click", e => { const b = $("instbox"); if (b.open && !b.contains(e.target)) b.open = false; });
document.addEventListener("pointerdown", e => {   // касание вне графика убирает подсказку
  if (e.target.id === "hit") return;
  $("tip").style.display = "none"; const c = $("cx"); if (c) c.setAttribute("opacity", 0);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("instbox").open = false; });
$("disc").textContent = CONFIG.disclaimer;
load();
</script>
</body>
</html>
