<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стратегия на ES — результаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b26;--panel:#14232f;--line:#26394a;--ink:#ece6d8;--mute:#8da0b0;--gain:#6fc3a0;--loss:#d9806b;--brass:#c9a96a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 420px at 90% -5%,rgba(201,169,106,.10),transparent 60%),var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:0 clamp(16px,5vw,64px) 48px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font:500 13px "IBM Plex Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:28px;height:1px;background:var(--brass);vertical-align:middle;margin-right:14px}
.meta{color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.hero{padding:64px 0 52px}
.hero-head{margin-bottom:30px}
.eyebrow{color:var(--brass);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:18px}
.name{font:400 clamp(40px,6.2vw,84px)/1 Newsreader,Georgia,serif;margin:0;letter-spacing:-.02em}
.result{position:relative;background:var(--panel);border:1px solid var(--line);padding:30px 32px 22px}
.result::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:2px;background:var(--brass)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.rgrid > div{padding:14px 14px 12px 0}
.rgrid > div:nth-child(3n+2),.rgrid > div:nth-child(3n){padding-left:16px;border-left:1px solid var(--line)}
.rgrid > div:nth-child(n+4){border-top:1px solid var(--line)}
.rgrid > div > span{display:block;font:500 10.5px "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.rgrid > div > b,.rgrid summary b{font-weight:400;font-size:14px;line-height:1.4;color:var(--ink)}
.rl{display:flex;align-items:center;gap:14px;color:var(--mute);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.rl::before{content:"";width:28px;height:1px;background:var(--brass)}
.tag{font-style:normal;color:var(--ink);border:1px solid var(--line);padding:2px 9px;letter-spacing:.14em}
.csign{font-size:.46em;vertical-align:.78em;margin-right:.1em;opacity:.8}
.numrow{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 30px;margin:20px 0 26px}
#total{font:400 clamp(48px,6.6vw,88px)/1 Newsreader,Georgia,serif;letter-spacing:-.02em;margin:0}
.nb{white-space:nowrap}
.rinst{font-style:normal;text-transform:none;letter-spacing:0;font-size:14px;color:var(--mute)}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:24px 40px;flex-wrap:wrap}
.isw{flex:1 1 340px;max-width:560px;margin-left:auto}
.ig{display:flex;align-items:center;gap:14px;margin-top:16px}
.gl{flex:none;width:122px;white-space:nowrap;font:500 10.5px "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ic{display:inline-block;padding:8px 16px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--mute);font:400 20px/1 Newsreader,Georgia,serif;text-decoration:none;transition:border-color .2s,color .2s}
a.ic:hover,a.ic:focus-visible{border-color:var(--brass);color:var(--ink);outline:0}
.ic.on{border-color:var(--brass);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.ic.off{opacity:.55;cursor:default}
.inote{margin:16px 0 0;color:var(--mute);font-size:12px;font-style:italic}
.brow{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.bg{padding:14px 12px 12px 16px;border-left:1px solid var(--line)}
.bg:first-child{padding-left:0;border-left:0}
.bg.g1{grid-column:span 1}.bg.g2{grid-column:span 2}.bg.g3{grid-column:span 3}
.bt{display:block;font:500 10.5px "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.bi{display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:8px 18px}
.bi em{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-bottom:2px}
.bi b{font-weight:400;font-size:14px;line-height:1.5;color:var(--ink)}
@media (min-width:901px){
  .rgrid{grid-template-columns:repeat(6,1fr)}
  .rgrid > div:nth-child(n){padding:14px 12px 12px 16px;border-left:1px solid var(--line);border-top:0}
  .rgrid > div:nth-child(1){padding-left:0;border-left:0}
}
.tip .tkp{color:var(--mute);margin-left:4px}
.tk{padding-bottom:8px;border-left:1px solid var(--line);padding-left:26px}
.tk:empty{display:none}
.tk span{display:block;font:500 10.5px "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.tk b{font:400 clamp(26px,3vw,38px)/1 Newsreader,Georgia,serif}
#total small{font-size:.32em;margin-left:.3em}
.instbox summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0}
.instbox summary::-webkit-details-marker{display:none}
.instbox summary b{margin-right:0}
.instbox summary:hover,.instbox summary:hover b,.instbox[open] summary b{color:var(--brass)}
.instbox summary:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.chev{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .2s}
.instbox[open] .chev{transform:rotate(-135deg);margin-top:3px}
.groups{position:absolute;right:0;top:calc(100% + 10px);z-index:20;width:min(700px,calc(100vw - 28px));display:grid;grid-template-columns:1fr;gap:22px;margin:0;padding:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.grp h3{font:500 12px "IBM Plex Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:0 0 4px}
.gnote{color:var(--mute);font-size:13px;margin:0 0 14px}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.inst{background:var(--panel);padding:16px 16px 12px;color:inherit;text-decoration:none;display:block}
a.inst:hover{background:#18303f}
.inst.live{box-shadow:inset 2px 0 0 var(--brass)}
.ih{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font:400 30px Newsreader,Georgia,serif}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:2px 8px;white-space:nowrap}
.live .chip{color:var(--brass);border-color:var(--brass)}
.iname{color:var(--mute);font-size:13px;margin:2px 0 12px}
.inst dl{margin:0}
.inst dl div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0;font-size:12.5px}
.inst dt{color:var(--mute)}
.inst dd{margin:0;text-align:right}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.chartwrap{background:var(--panel);border:1px solid var(--line);padding:20px 20px 12px;position:relative}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{background:none;border:1px solid transparent;color:var(--mute);font:inherit;font-size:14px;padding:5px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--brass)}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip small{color:var(--mute);margin-left:6px}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:6px 10px;font-size:13px;display:none;white-space:nowrap}
.subhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:26px 0 10px}
.subhead span{font:500 11px "IBM Plex Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.subhead .tabs{margin:0}
.snote{color:var(--mute);font-size:12px;font-style:italic}
h2{font:400 20px Newsreader,Georgia,serif;margin:40px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0}
.grid div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid dt{color:var(--mute);font-size:13px}
.grid dd{margin:2px 0 0;font:400 26px Newsreader,Georgia,serif}
.grid small,td small{font:400 13px "IBM Plex Sans",sans-serif;color:var(--mute);margin-left:6px}
.tablewrap{max-height:380px;overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 16px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{white-space:nowrap;position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:400;font-size:13px}
.status{color:var(--mute);font-size:13px;margin-top:12px}
th:first-child{left:0;z-index:2}
td:first-child{position:sticky;left:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
@media (max-width:900px){
  .isw{flex-basis:100%;max-width:none;margin-left:0}
  .brow{grid-template-columns:1fr}
  .bg.g1,.bg.g2,.bg.g3{grid-column:1/-1}
  .bg:nth-child(n){padding:14px 0 12px;border-left:0}
  .bg + .bg{border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .hero{padding:40px 0 32px}
  .result{padding:24px 20px 16px}
  .groups{grid-template-columns:1fr}
}
@media (max-width:640px){
  .rgrid{grid-template-columns:1fr 1fr}
  .rgrid > div:nth-child(n){padding:12px 12px 10px 0;border-left:0;border-top:1px solid var(--line)}
  .rgrid > div:nth-child(2n){padding-left:14px;border-left:1px solid var(--line)}
  .rgrid > div:nth-child(-n+2){border-top:0}
  body{padding:0 14px 36px}
  header{padding:18px 0}
  .brand span{display:block;margin:2px 0 0}
  .hero{padding:28px 0 18px;gap:10px}
  .chartwrap{padding:12px 8px 8px}
  .tabs{flex-wrap:wrap}
  .tabs button{padding:5px 10px;font-size:13px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid div{padding:12px 12px}
  .grid dd{font-size:22px}
  h2{margin-top:28px}
  th,td{padding:7px 10px;font-size:13px}
}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:11px;line-height:1.6;font-style:italic;max-width:none}
@media (prefers-reduced-motion:no-preference){.line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
</style>
</head>
<body>
<header>
  <div class="brand">Globextrader</div>
  <div class="meta">Intraday Scalping Strategy</div>
</header>

<section class="hero">
  <div class="hero-head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="name" id="name"></h1>
  </div>
  <div class="result">
    <div class="rtop">
      <div class="rleft">
        <div class="rl"><span>Результат</span><i class="tag">ES</i><em class="rinst" id="rinst"></em></div>
        <div class="numrow"><div class="num" id="total">—</div><div class="tk" id="tk"></div></div>
      </div>
      <div class="isw" id="isw"></div>
    </div>
    <div class="rgrid" id="cap"></div>
    <div class="brow" id="brow"></div>
  </div>
</section>



<h2 class="dh">Общая статистика</h2>
<dl class="grid" id="stats"></dl>
<div class="subhead dh"><span>По периодам</span><div class="tabs" id="sTabs"></div><em class="snote" id="snote"></em></div>
<dl class="grid" id="dstats"></dl>

<h2 class="dh">Детальная статистика</h2>
<section class="chartwrap" aria-label="График результатов">
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="mtabs"></div>
  <svg id="chart" viewBox="0 0 1000 380" role="img" aria-label="График P&L"></svg>
  <svg id="dd" viewBox="0 0 1000 90" role="img" aria-label="Просадка"></svg>
  <div class="tip num" id="tip"></div>
  <div class="tip num" id="tip2"></div>
</section>
<div class="status" id="status"></div>
<pre class="status" id="debug" style="white-space:pre-wrap;display:none"></pre>

<h2 class="dh">Детальная таблица</h2>
<div class="tabs" id="tblTabs"></div>
<div class="tablewrap"><table class="num"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<footer id="disc"></footer>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {
  title: "Стратегия на ES",
  subtitle: "E-mini S&P 500 Futures",
  // Ссылка на CSV: Файл → Поделиться → Опубликовать в Интернете → лист → формат CSV
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT933YGGprjxlAVyraxpCgAt62U9KIj8WO5yZEwBW12H0BOaoG-XRnX7dLzR4cN-DgrTcRfZm3OvuJS/pub?gid=81088550&single=true&output=csv",
  // Столбцы ищутся по названию в первой строке; если не найдены — берутся по номеру (0 = первый)
  dateHeader: ["DATE"], pnlHeader: ["PNL,$"],   // можно несколько вариантов названия; берётся первый найденный (пробелы не важны)
  dateColumn: 0, pnlColumn: 1,
  // Необязательные столбцы (названия в первой строке). Если столбца нет — соответствующие данные не показываются.
  ticksHeader: ["TOTAL TICKS", "TICKS"], winsHeader: ["WIN"], lossesHeader: ["LOSS"], tradesHeader: ["TOTAL TRADES", "TRADES"],
  capital: 0,             // размер счёта в $. Если указать, рядом с $ покажется доходность в %
  periodsPerYear: 252,
  updateNY: { h: 16, m: 30 },   // обновление раз в сутки в это время по Нью-Йорку
  // Шапка сайта. Тексты, инструменты, стоп/тейк по каждому инструменту — всё меняется здесь.
  strategy: {
    eyebrow: "Торговая стратегия",
    name: "Scalping Globextrader",
    typeLabel: "Тип торговли",
    ledeMain: "Внутридневной скальпинг",
    executionLabel: "Подход к исполнению",
    execution: "Дискреционное исполнение по системным правилам",
    showInstruments: false,   // true — вернуть выпадающий список «Инструмент» с фьючерсами и опционами
    terms: [["Тейк-профит", "10 тиков · $125"], ["Стоп-лосс", "20 тиков · $250"]],
    specs: [["Торговое окно", "09:30–11:00 ET, <span class=\"nb\">Нью-Йорк</span>"], ["Объём", "1 контракт, без реинвестирования"], ["Стоимость тика", "$12,50"], ["Комиссия", "$4 за сделку, учтена"]],
    // href: ссылка на страницу со статистикой инструмента (когда появится); live: true — результаты уже на этой странице
    groups: [
      { title: "Фьючерсы", tickLabel: "Тик", note: "CME · торговля 09:30–11:00 ET", items: [
        { sym: "ES", name: "E-mini S&P 500", tick: "0,25 пт = $12,50", stop: "20 тиков · $250", take: "10 тиков · $125", live: true, href: "" },
        { sym: "NQ", name: "E-mini Nasdaq-100", tick: "0,25 пт = $5,00", stop: "", take: "", href: "" },
        { sym: "YM", name: "E-mini Dow Jones", tick: "1 пт = $5,00", stop: "", take: "", href: "" }
      ] },
      { title: "Опционы 0DTE", tickLabel: "Контракт", note: "Экспирация в день торговли (0DTE) · 09:30–11:00 ET", items: [
        { sym: "SPX", name: "Индекс S&P 500", tick: "×$100", stop: "", take: "", href: "" },
        { sym: "SPY", name: "ETF S&P 500", tick: "×100 акций", stop: "", take: "", href: "" },
        { sym: "QQQ", name: "ETF Nasdaq-100", tick: "×100 акций", stop: "", take: "", href: "" },
        { sym: "DIA", name: "ETF Dow Jones", tick: "×100 акций", stop: "", take: "", href: "" }
      ] }
    ]
  },
  disclaimer: "Результаты получены в ходе ретроспективного тестирования (бэктеста) на исторических данных и не являются результатами реальной торговли. Такие результаты имеют ограничения: они определены постфактум и могут не отражать влияние проскальзывания, ликвидности, задержек исполнения и иных рыночных условий. Прошлые результаты не гарантируют будущей доходности. Торговля фьючерсами сопряжена с высоким риском, включая риск потери всех вложенных средств. Материалы носят исключительно информационный характер и не являются индивидуальной инвестиционной рекомендацией, офертой или предложением приобрести какие-либо финансовые инструменты или услуги."
};
/* ===================== */

const $ = id => document.getElementById(id);
const MON = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const UNITS = {
  day:   { tab: "Дни",    avg: "Средний день",    pos: "Прибыльных дней",    best: "Лучший день",    worst: "Худший день",    col: "День" },
  week:  { tab: "Недели", avg: "Средняя неделя",  pos: "Прибыльных недель",  best: "Лучшая неделя",  worst: "Худшая неделя",  col: "Неделя с" },
  month: { tab: "Месяцы", avg: "Средний месяц",   pos: "Прибыльных месяцев", best: "Лучший месяц",   worst: "Худший месяц",   col: "Месяц" }
};
let days = [], view = "day";
const cap = CONFIG.capital > 0;
const sign = v => (v >= 0 ? "+" : "−");
const money = v => sign(v) + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
const pctS = v => sign(v) + Math.abs(v / CONFIG.capital * 100).toFixed(2) + "%";
const val = v => money(v) + (cap ? `<small>${pctS(v)}</small>` : "");
const cls = v => (v >= 0 ? "pos" : "neg");
const d2 = n => String(n).padStart(2, "0");
const fmtDate = t => { const d = new Date(t); return `${d2(d.getUTCDate())}.${d2(d.getUTCMonth() + 1)}.${String(d.getUTCFullYear()).slice(2)}`; };

/* ---------- время обновления (16:30 Нью-Йорк) ---------- */
function nyOffset(ts) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23",
    year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" })
    .formatToParts(ts).map(x => [x.type, x.value]));
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - (ts - ts % 1000);
}
function cutoffs(now = Date.now()) {
  const w = new Date(now + nyOffset(now));
  const at = dd => { const g = Date.UTC(w.getUTCFullYear(), w.getUTCMonth(), w.getUTCDate() + dd, CONFIG.updateNY.h, CONFIG.updateNY.m); return g - nyOffset(g); };
  const today = at(0);
  return today <= now ? { last: today, next: at(1) } : { last: at(-1), next: today };
}

/* ---------- данные ---------- */
let fetchErr = "";
let slashOrder = "dmy";
function parseDate(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d{1,2})([.\/])(\d{1,2})[.\/](\d{4})/))) {
    const mdy = m[2] === "/" && slashOrder === "mdy";
    return Date.UTC(+m[4], (mdy ? +m[1] : +m[3]) - 1, mdy ? +m[3] : +m[1]);
  }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return Date.UTC(+m[1], m[2] - 1, +m[3]);
  return NaN;
}
function splitCsv(line) {
  const out = []; let cur = "", q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out;
}
let dbg = null;
const has = { ticks: false, win: false, loss: false, trades: false };
function toNum(x) {   // 230 · -24 · 1 234,5 · 1,234.56 · 1.234,56 · (24) · $230

// o.stack(p) -> [[value, color], ...]: положительные значения растут вверх, отрицательные вниз от нуля
// o.label(p) -> текст (или массив текстов по сегментам); o.range -> фиксированная ось; o.tip(i) -> html

      if (mode) bars += `<text x="${x(i)}" y="${v >= 0 ? y1 - 5 : y1 + 13}" text-anchor="middle" fill="#ece6d8" font-size="${fs}">${lab(labels[j])}</text>`;
    });

  });

  $("chart").innerHTML = g + bars + legend + xLabels(P, x, P.length <= 12 ? 12 : 14) + overlayFor("m", pad.t, H - pad.b, H);

function hideHover() {

  $("tip").style.display = "none"; $("tip2").style.display = "none";

function hover(n, x, specs) {
  const show = i => specs.forEach(sp => {
    const m = sp.mark ? sp.mark(i) : null, set = (k, f) => { const el = $(sp.p + k); if (el) f(el); };
    set("_x", el => { el.setAttribute("x1", x(i)); el.setAttribute("x2", x(i)); el.setAttribute("opacity", 1); });
    set("_y", el => { el.setAttribute("opacity", m ? 1 : 0); if (m) { el.setAttribute("y1", m.y); el.setAttribute("y2", m.y); } });
    set("_d", el => { el.setAttribute("opacity", m ? 1 : 0); if (m) { el.setAttribute("cx", x(i)); el.setAttribute("cy", m.y); } });

  const u = UNITS[tblView];
  $("tblTabs").innerHTML = Object.entries(UNITS).map(([k, x]) => `<button data-v="${k}" aria-pressed="${k === tblView}">${x.tab}</button>`).join("");
  const cols = [[u.col, null], ["Trades", "trades"], ["Win", "win"], ["Loss", "loss"], ["Win rate", "wr"], ["Total ticks", "ticks"]].filter(c => !c[1] || (c[1] === "wr" ? has.win && has.trades : has[c[1]]));
  $("thead").innerHTML = `<tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}<th>P&L, $</th><th>Cum. P&L, $</th>${cap ? "<th>%</th>" : ""}</tr>`;
  let cc = 0; const all = periods(tblView).map(p => ({ ...p, cum: (cc += p.pnl) }));
  const rows = all.reverse();
  $("tbody").innerHTML = rows.map(p => "<tr>" + cols.map(c => !c[1] ? `<td>${p.label}</td>` : c[1] === "ticks" ? `<td class="${cls(p.ticks)}">${tickS(p.ticks)}</td>` : c[1] === "wr" ? `<td>${p.trades ? Math.round(p.win / p.trades * 100) + "%" : "—"}</td>` : `<td>${p[c[1]]}</td>`).join("") +
    `<td class="${cls(p.pnl)}">${money(p.pnl)}</td><td>${money(p.cum)}</td>${cap ? `<td class="${cls(p.pnl)}">${pctS(p.pnl)}</td>` : ""}</tr>`).join("");
}
$("sTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { statView = b.dataset.v; stats(periods(statView)); } });
$("tblTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tblView = b.dataset.v; tables(); } });
let metric = "cum";
const METRICS = { cum: "Cumulative P&L", pnl: "P&L", ticks: "Total ticks", trades: "Trades", wl: "Win / Loss", wr: "Win rate" };
const avail = k => k === "ticks" ? has.ticks : k === "trades" ? has.trades : k === "wl" ? has.win && has.loss : k === "wr" ? has.win && has.trades : true;
const GAIN = "#6fc3a0", LOSS = "#d9806b", BRASS = "#c9a96a";
const wrOf = p => (p.trades ? p.win / p.trades * 100 : 0);

function render() {
  setSize();
  if (!avail(metric)) metric = "cum";
  const P = periods(view);
  let c = 0; const cum = P.map(p => (c += p.pnl));
  let ct = 0; const cumT = P.map(p => (ct += p.ticks || 0));
  const tkp = v => has.ticks ? ` <span class="tkp">(${v ? tickS(v) : "0"} ticks)</span>` : "";
  const det = p => `<small>${p.trades ? `${p.trades} сделок · ${p.win} win · ${p.loss} loss` : ""}</small>`;
  if (metric === "cum") lineChart(P, cum, { dd: view === "day", yFmt: axisNum, unit: "$", cumT: has.ticks ? cumT : null, tip: i => `${P[i].label}: <b class="${cls(cum[i])}">${money(cum[i])}</b>${tkp(cumT[i])}<small>за период ${money(P[i].pnl)}${tkp(P[i].ticks)}</small>` });
  if (metric === "pnl") barChart(P, { stack: p => [[p.pnl, p.pnl >= 0 ? GAIN : LOSS]], label: p => Math.round(p.pnl), hv: p => p.pnl, yFmt: axisNum, legend: "$", tip: i => `${P[i].label}: <b class="${cls(P[i].pnl)}">${money(P[i].pnl)}</b>${tkp(P[i].ticks)}${det(P[i])}` });
  if (metric === "ticks") barChart(P, { legend: "ticks", hv: p => p.ticks, stack: p => [[p.ticks, p.ticks >= 0 ? GAIN : LOSS]], label: p => Math.round(p.ticks), tip: i => `${P[i].label}: <b class="${cls(P[i].ticks)}">${tickS(P[i].ticks)}</b> тиков${det(P[i])}` });
  if (metric === "trades") barChart(P, { legend: "trades", hv: p => p.trades, stack: p => [[p.trades, BRASS]], label: p => p.trades, tip: i => `${P[i].label}: <b>${P[i].trades}</b> сделок<small>${P[i].win} win · ${P[i].loss} loss</small>` });
  if (metric === "wl") barChart(P, { stack: p => [[p.win, GAIN], [-p.loss, LOSS]], label: p => [p.win, p.loss], yFmt: v => Math.abs(v), legend: "Win ↑ · Loss ↓", tip: i => `${P[i].label}: <b class="pos">${P[i].win}</b> win · <b class="neg">${P[i].loss}</b> loss<small>всего ${P[i].trades}</small>` });
  if (metric === "wr") barChart(P, { stack: p => [[wrOf(p), BRASS]], label: p => Math.round(wrOf(p)), hv: wrOf, range: [0, 100], yFmt: v => v, legend: "%", tip: i => `${P[i].label}: <b>${wrOf(P[i]).toFixed(0)}%</b><small>${P[i].win} из ${P[i].trades} сделок</small>` });
  stats(periods(statView));
  $("tabs").innerHTML = Object.entries(UNITS).map(([k, u]) => `<button data-v="${k}" aria-pressed="${k === view}">${u.tab}</button>`).join("");
  $("mtabs").innerHTML = Object.entries(METRICS).filter(([k]) => avail(k)).map(([k, l]) => `<button data-m="${k}" aria-pressed="${k === metric}">${l}</button>`).join("");
}
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (days.length && Math.round($("chart").getBoundingClientRect().width) !== W) render(); }, 150); });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { view = b.dataset.v; render(); } });
$("mtabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { metric = b.dataset.m; render(); } });

/* ---------- загрузка: раз в сутки после 16:30 ET ---------- */
async function load() {
  const { last, next } = cutoffs();
  let csv = null, at = Date.now(), note = "";
  if (CONFIG.sheetCsvUrl) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem("es_cache")); } catch (e) {}
    if (cache && cache.cutoff === last && !location.search.includes("fresh")) { csv = cache.csv; at = cache.at; }
    else {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl + (CONFIG.sheetCsvUrl.includes("?") ? "&" : "?") + "_=" + Date.now());   // без опции cache: она вызывает CORS-preflight, который Google не пропускает
        if (!res.ok) throw new Error(res.status);
        csv = await res.text();
        if (parseCsv(csv).length >= 2) try { localStorage.setItem("es_cache", JSON.stringify({ cutoff: last, csv, at })); } catch (e) {}
      } catch (e) {
        fetchErr = String(e);
        if (cache) { csv = cache.csv; at = cache.at; } else note = "Не удалось загрузить таблицу. Проверьте, что лист опубликован в формате CSV.";
      }
    }
  } else note = "Демо-данные. Вставьте ссылку на CSV в CONFIG.sheetCsvUrl.";
  days = csv ? parseCsv(csv) : [];
  const showDebug = () => {
    if (location.search.includes("debug") && !dbg && fetchErr) { $("debug").style.display = "block"; $("debug").textContent = "Диагностика\nОшибка загрузки: " + fetchErr; }
    if (location.search.includes("debug") && dbg) {
      $("debug").style.display = "block";
      $("debug").textContent = `Диагностика${dbg.problem ? " — ОШИБКА: " + dbg.problem : ""}\nСтрока заголовков: ${dbg.headerRow}\nСтолбцы в таблице: ${dbg.heads}\nДата: ${dbg.date}; деньги: ${dbg.pnl}; остальные: ${dbg.found}\nПорядок дат с косой чертой: ${slashOrder}\nСтрок со сдвинутыми ячейками (исправлены автоматически): ${shifted.length ? shifted.join(", ") : "нет"}\nДней прочитано: ${dbg.days}; с ${dbg.first} по ${dbg.last}; сумма P&L: ${dbg.total}\nПервые строки:\n${dbg.sample}`;
    }
  };
  if (days.length < 2) {
    if (CONFIG.sheetCsvUrl) {   // реальный сайт: демо-цифры не показываем никогда
      $("status").textContent = note || ("Не удалось прочитать данные из таблицы" + (dbg && dbg.problem ? ": " + dbg.problem : "") + ". Откройте страницу с ?debug для диагностики.");
      document.querySelectorAll(".result, .chartwrap, .dh, #stats, #dstats, #tblTabs, .tablewrap").forEach(e => e.style.display = "none");
      showDebug(); setTimeout(load, 10 * 60000); return;
    }
    days = demoData(); note = note || "Демо-данные.";
  }
  document.querySelectorAll(".result, .chartwrap, .dh, #stats, #dstats, #tblTabs, .tablewrap").forEach(e => e.style.display = "");
  $("status").textContent = note || "(данные обновляются раз в сутки)";
  showDebug();
  render(); tables();
  setTimeout(load, Math.min(next - Date.now() + 5000, 2 ** 31 - 1));
}

function renderIntro() {
  const S = CONFIG.strategy;
  document.title = S.name + " — результаты";
  $("eyebrow").textContent = S.eyebrow; $("name").textContent = S.name;
  const live = S.groups.flatMap(g => g.items).find(i => i.live) || {};
  $("rinst").textContent = live.name ? `(Фьючерс на ${live.name})` : "";   // что за инструмент — в строке заголовка результата
  const cells = [[S.typeLabel, `<b>${S.ledeMain}</b>`], ["Период", `<b id="period">—</b>`]].concat(S.specs.map(p => [p[0], `<b>${p[1]}</b>`]));
  if (S.showInstruments) cells.push(["Инструмент", `<details class="instbox" id="instbox"><summary><b id="curInst"></b><i class="chev"></i></summary><div class="groups" id="insts"></div></details>`]);
  $("cap").innerHTML = cells.map(c => `<div><span>${c[0]}</span>${c[1]}</div>`).join("");
  const grp = (title, cls, items) => `<div class="bg ${cls}"><span class="bt">${title}</span><div class="bi">${items.map(i => `<div>${i[0] ? `<em>${i[0]}</em>` : ""}<b>${i[1]}</b></div>`).join("")}</div></div>`;
  $("brow").innerHTML = grp("Условия сделки", "g2", S.terms) + grp(S.executionLabel, "g2", [["", S.execution]]);
  // переключатель инструментов: ссылка работает, как только у инструмента появляется href
  const chip = i => i.live ? `<span class="ic on" aria-current="page" title="${i.name}">${i.sym}</span>`
    : i.href ? `<a class="ic" href="${i.href}" title="${i.name}">${i.sym}</a>` : `<span class="ic off" title="${i.name}">${i.sym}</span>`;
  $("isw").innerHTML = `<div class="rl"><span>Инструменты</span></div>` +
    S.groups.map(g => `<div class="ig"><span class="gl">${g.title}</span><div class="chips">${g.items.map(chip).join("")}</div></div>`).join("");
  if (!S.showInstruments) return;
  $("curInst").textContent = (S.groups.flatMap(g => g.items).find(i => i.live) || {}).sym || "";
  const row = (k, v) => `<div><dt>${k}</dt><dd>${v || "—"}</dd></div>`;
  const card = (i, lbl) => {
    const tag = i.href ? "a" : "div", chip = i.live ? "Результаты ниже" : i.href ? "Статистика →" : "Скоро";
    return `<${tag} class="inst${i.live ? " live" : ""}"${i.href ? ` href="${i.href}"` : ""}><div class="ih"><span class="sym">${i.sym}</span><span class="chip">${chip}</span></div><div class="iname">${i.name}</div><dl>${row(lbl, i.tick)}${row("Стоп-лосс", i.stop)}${row("Тейк-профит", i.take)}</dl></${tag}>`;
  };
  $("insts").innerHTML = S.groups.map(g => `<div class="grp"><h3>${g.title}</h3><p class="gnote">${g.note}</p><div class="icards">${g.items.map(i => card(i, g.tickLabel || "Тик")).join("")}</div></div>`).join("");
}
renderIntro();
document.addEventListener("click", e => { const b = $("instbox"); if (b && b.open && !b.contains(e.target)) b.open = false; });
document.addEventListener("pointerdown", e => { if (!/_hit$/.test(e.target.id || "")) hideHover(); });   // касание вне графика убирает подсказки
document.addEventListener("keydown", e => { const b = $("instbox"); if (e.key === "Escape" && b) b.open = false; });
$("disc").textContent = CONFIG.disclaimer;
load();
</script>
